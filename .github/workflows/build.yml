name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.yaml
            pubspec.lock
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check Flutter
        run: flutter --version
      - name: Enable Gradle wrapper
        run: chmod +x android/gradlew
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test upload and original deletion flow
        run: flutter test --no-pub --reporter expanded
      - name: Build arm64 release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/photo-uploader-release.p12"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          python3 scripts/android_signing.py restore --output "$ANDROID_KEYSTORE_PATH"
          flutter build apk --split-per-abi --target-platform android-arm64 --no-pub --build-number "$((1000 + GITHUB_RUN_NUMBER))"
      - name: Upload arm64 APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: photo-uploader-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          compression-level: 0
