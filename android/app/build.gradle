plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('key.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def releaseStore = System.getenv('ANDROID_KEYSTORE_PATH') ?: signingProperties['storeFile']
def releasePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: signingProperties['storePassword']

android {
    namespace 'com.example.photo_uploader'
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    defaultConfig {
        applicationId 'com.example.photo_uploader'
        minSdk Math.max(24, flutter.minSdkVersion)
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }
    signingConfigs {
        release {
            storeFile releaseStore ? file(releaseStore) : null
            storeType 'PKCS12'
            storePassword releasePassword
            keyAlias 'photo-uploader'
            keyPassword releasePassword
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'org.opencv:opencv:4.13.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
}
